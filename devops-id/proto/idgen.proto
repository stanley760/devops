// gRPC contract for the devops-id ID generation service.
//
// Semantic conventions:
//   - biz_tag is a business identifier (e.g. user/role/menu) that selects an independent snowflake worker space
//   - within the same biz_tag IDs are unique and roughly increasing; different biz_tags have independent ID spaces, so duplicates are allowed
//   - error codes: InvalidArgument (invalid parameters) / Unavailable (clock rollback, lease expiry,
//     service unavailable) -- only Unavailable is retryable
syntax = "proto3";

package idgen;

option go_package = "devops-id/pkg/idgenpb;idgenpb";

// IdGen is a distributed ID generation service.
service IdGen {
  // Next fetches a single ID.
  rpc Next(NextRequest) returns (NextReply);

  // BatchNext atomically allocates count IDs (for client prefetch buffering).
  // Within the same biz_tag results are monotonically increasing, but not contiguous.
  rpc BatchNext(BatchNextRequest) returns (BatchNextReply);
}

message NextRequest {
  string biz_tag = 1; // business identifier, must not be empty
}

message NextReply {
  int64 id = 1; // the allocated ID
}

message BatchNextRequest {
  string biz_tag = 1; // business identifier, must not be empty
  int32 count = 2;    // number requested, 1..100000
}

message BatchNextReply {
  repeated int64 ids = 1; // the allocated ID list, monotonically increasing
}
