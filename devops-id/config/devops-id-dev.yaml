# dev environment overrides: only differences; bootstrap.yaml is the shared baseline

log:
  level: debug
  console: true

idgen:
  leaf_name: devops-id
  worker_cache: ../data
  allow_local_fallback: true   # dev single instance: allow local fallback when etcd is unavailable

etcd:                    # snowflake worker coordination (mapped to host port 2379 by the dev compose setup)
  endpoints:
    - "127.0.0.1:2379"
  dial_timeout: 5s
  lease_ttl: 10s         # slot release delay after a crash

# Local development: Jaeger is exposed on host port 4318 by the dev compose setup; metrics use a separate HTTP port 9991.
observability:
  otlp_endpoint: "http://127.0.0.1:4318"
  sampler_ratio: 1.0
  metrics_enabled: true
  metrics_listen: ":9991"
