# Base configuration for the devops-id distributed ID generation service

grpc:
  listen: ":9990"
  reflection: false       # automatically force-enabled in dev, for grpcurl debugging

nacos:
  enabled: true
  endpoints:
    - "127.0.0.1:8848"
  namespace: ""
  group: "DEVOPS_GROUP"
  username: "nacos"
  password: "nacos"
  timeout: 5s
  config:
    data_ids:
      - "devops-id.yaml"
    group: "DEVOPS_GROUP"
    timeout: 5s
    required: false
  registry:
    service_name: "devops-id"
    cluster: "DEFAULT"
    weight: 1
    meta:
      service: "devops-id"

log:
  level: debug           # debug | info | warn | error
  dir: logs              # directory for log files (the devops-id service's own logs)
  console: true          # whether to also output to the console
  format: text           # text | json
  buffer: 4096           # async write buffer size (entries); new logs are dropped when full
  max_size: 100          # per-file size limit (MB); rotate immediately when full
  max_backups: 30        # number of historical files to keep, 0 for unlimited
  max_age: 7             # days to keep historical files, 0 for unlimited
  compress: gzip         # none | gzip | zstd
  rotation_interval: 24h  # time-based rotation interval; empty or 0 rotates by size only

idgen:
  leaf_name: devops-id   # etcd path: idgen/snowflake/{leaf_name}/{biz_tag}/
  worker_cache: data     # local cache: {worker_cache}/{leaf_name}/{biz_tag}/worker_id + watermark
  allow_local_fallback: false  # P0-1 fail-closed: refuse ID generation when etcd is unavailable; degrade only when explicitly enabled
  max_biz_tag_len: 64    # maximum byte length of biz_tag
  max_generators: 1024   # maximum number of concurrent generators
  max_batch_count: 100000 # maximum batch size per request
  watermark_safety_margin: 5s    # watermark safety margin (must be greater than persist_interval)
  watermark_persist_interval: 3s # watermark persistence interval
  watermark_max_wait: 30s        # maximum time to wait for the watermark window on restart
