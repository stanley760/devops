grpc:
  listen: ":19990"

service:
  name: devops-id-probe   # 探活实例身份；不参与业务流量

log:
  level: info
  console: true
  format: text

idgen:
  leaf_name: probe-leaf
  worker_cache: /app/data

etcd:
  endpoints:
    - "127.0.0.1:2379"
  dial_timeout: 5s
  lease_ttl: 10s

observability:
  otlp_endpoint: ""
  sampler_ratio: 1.0
  metrics_enabled: false