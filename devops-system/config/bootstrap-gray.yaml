# devops-system 灰度实例 bootstrap：以 devops-system-gray 服务身份运行，
# 供 Higress canary 路由（Header/Cookie 分流）与 gray.devops.local 专用路由（100% 直达）使用。
# 本地启动：go run . server -f config/bootstrap-gray.yaml

server:
  port: 9998                 # 与主实例 9999 错开
  read_timeout: 10s
  write_timeout: 10s
  trusted_proxies:
    - 127.0.0.1
    - "::1"

# 服务标识：灰度实例身份是 devops-system-gray（观测用名），但业务配置与主实例
# 共用——config_name 覆盖为 devops-system 后，环境文件名从主实例名推导
# （devops-system-dev.yaml）；不覆盖则会从灰度名推导出不存在的
# devops-system-gray-dev.yaml，实例以 mysql.host must not be empty 启动失败。
service:
  name: devops-system-gray
  config_name: devops-system
