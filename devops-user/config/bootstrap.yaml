# devops-user（C端用户服务）基础配置
#
# 端口 10000：devops-system 用 9999、devops-id 用 9990(gRPC)/9991(metrics)，
# 10000 避开已知占用（README 记录 9999、8848 曾被其他程序占用）。

# 网关暴露（免 JWT）端点白名单 —— 本服务的唯一声明。
#
# 一次声明，两处消费：
#   1. 网关侧：Higress 的 public ingress 由本段渲染（just gen-ingress），
#      所以「网关放行的路径」不会和「应用层豁免的路径」各写一份而漂移；
#   2. 应用层：jwt 模式（前面没有网关的环境）下，它就是粗粒度守卫的豁免表。
# 各服务的路由测试还会拿它和实际注册的接口比对，防止白名单与 API 面脱节。
#
# 改白名单只改这里，不要改代码或 ingress YAML。
gateway:
  # 身份来源：gateway = JWT 只在网关验一次（业务服务不验签，只取网关注入的身份头）。
  identity_source: gateway
  expose:
    prefix: /user
    host: user-api.devops.local
    destination: devops-user.DEVOPS-GROUP.public.nacos:10000
    endpoints:
      - path: /api/v1/auth/login
        reason: 登录：签发 access + refresh 令牌
      - path: /api/v1/auth/register
        reason: 注册：开放接口，匿名可调用
      - path: /api/v1/auth/refresh
        reason: 刷新：access 过期后唯一的出路，必须与 login 同样匿名
      - path: /api/v1/auth/captcha
        reason: 验证码：登录/注册前取题，此时调用方还没有任何凭据
      - path: /api/v1/oauth/providers
        reason: 第三方登录方式列表：前端据此渲染登录入口，此时还没有本地令牌
      # 第三方回调：平台重定向回来，靠一次性 state 校验防 CSRF，不依赖登录态。
      # 路径必须逐个 provider 写全：Higress 按前缀匹配，合写成
      # /user/api/v1/oauth 会把 bind / bind-start（需要登录）一起放行，
      # 未登录用户就能发起绑定劫持。
      - path: /api/v1/oauth/github/callback
        reason: GitHub 回调：一次性 state 校验，不依赖登录态
      - path: /api/v1/oauth/google/callback
        reason: Google 回调：一次性 state 校验，不依赖登录态
      - path: /api/v1/oauth/wechat/callback
        reason: 微信开放平台回调：一次性 state 校验，不依赖登录态
      # 主机级端点：挂在服务自己的域名上，与 /user 前缀无关。
      - path: /.well-known/jwks.json
        absolute: true
        reason: 验证公钥（JWKS），供其他服务自验与人工排障，非业务流量

server:
  port: 10000
  read_timeout: 10s
  write_timeout: 10s
  trusted_proxies:          # 可信反向代理 IP 或 CIDR；不在代理后建议置空 []
    - 127.0.0.1
    - "::1"

nacos:
  enabled: true
  endpoints:
    - "127.0.0.1:8848"
  namespace: ""
  group: "DEVOPS_GROUP"
  username: "nacos"
  password: "nacos"
  timeout: 5s
  config:
    data_ids:
      - "devops-user.yaml"
    group: "DEVOPS_GROUP"
    timeout: 5s
    required: false
  registry:
    service_name: "devops-user"
    cluster: "DEFAULT"
    weight: 1
    meta:
      service: "devops-user"