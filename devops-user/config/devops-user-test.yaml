# devops-user test 环境覆盖：只保留差异项。
#
# 测试环境与 dev 的区别：
#   - MySQL/Redis 指向 deploy/docker-compose.yml 里的 test 实例（容器网络别名）；
#   - JWT 私钥与 issuer 独立于 devops-system（防止 B/C 端 token 互通，见 dev 覆盖文件头）；
#   - 日志收敛到 info，apidoc 保持开启供联调排障。

log:
  level: info
  console: true
  format: json
  buffer: 4096
  max_size: 50
  max_backups: 10
  max_age: 3
  compress: gzip
  rotation_interval: 24h

mysql:
  host: mysql
  port: 3306
  username: devops
  password: devopspwd        # 与 deploy/docker-compose.yml 的 MYSQL_PASSWORD 一致（测试库专用口令）
  database: devops
  charset: utf8mb4
  max_idle_conns: 20
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idletime: 10m
  log_level: warn

redis:
  host: redis
  port: 6379
  password: "123456"
  db: 1                      # 与 devops-system 的 db 0 分隔

