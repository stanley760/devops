# Single-host containerized deployment: MySQL + Redis + Nacos + etcd / Higress + devops-id + devops-system
#
# Standard flow (or use the root justfile shortcuts):
#   just build                        # build images
#   just migrate                      # business tables + seed data
#   just up                           # start
# Equivalent to:
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml run --rm devops-system migrate
#   docker compose -f deploy/docker-compose.yml up -d
#   The backend is never published directly to the host — all access goes through Higress:
#   curl -H 'Host: api.devops.local' http://localhost:8080/healthz
#
# Higress gateway (optional):
#   docker compose -f deploy/docker-compose.yml --profile gateway up -d
#   curl -H 'Host: api.devops.local' http://localhost:8080/healthz
#   Console http://localhost:8001; Nacos console http://localhost:8848/nacos
#
# devops-id uses snowflake and allocates independent workers per leaf_name + biz_tag in etcd:
#   docker compose -f deploy/docker-compose.yml exec etcd etcdctl \
#     --endpoints=http://etcd:2379 get --prefix idgen/snowflake/
#
# Production note: all passwords in this file are local defaults; for K8s deployment see deploy/k8s/devops.yaml
#
# —— Network isolation (first layer of traffic-ingress containment) ——
#   edge  : gateway + business services only. Infrastructure containers are not on this
#          network and cannot reach devops-system:9999 directly.
#   infra : internal: true, no external egress; all middleware and business services
#          communicate here.
#   Business services join both networks: reachable by the gateway (edge) while still
#   able to reach databases and other middleware (infra), and they keep egress via
#   edge (for third-party APIs / webhooks).
#   Note: every service declares networks explicitly; the default network is not created.
#   A new service that omits networks would fall onto the default network and escape
#   the isolation — always declare it explicitly.
name: devops

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: devops        # must match database in config
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspwd     # must match deploy/config/*-prod.yaml
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpwd"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - infra

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
    expose:
      - "9848"
      - "9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - infra

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - infra

  # The Higress all-in-one is only suitable for local/trial environments; for production use Helm on K8s.
  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.2.3
    profiles: ["gateway"]
    ports:
      - "8001:8001"           # console
      - "8080:8080"           # HTTP gateway
      - "8443:8443"           # HTTPS gateway
    volumes:
      - ./higress:/data
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge                 # traffic ingress: same network as the business services so requests can be forwarded to 9999
      - infra                # also needs access to nacos / redis (McpBridge service sources)

  # devops-id snowflake worker coordination dependency
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - infra

  devops-id:
    build:
      context: ..
      dockerfile: devops-id/Dockerfile
    image: devops-id:latest
    environment:
      APP_ENV: prod
    volumes:
      - ./config/id-prod.yaml:/app/config/devops-id-prod.yaml:ro
      # per-biz_tag worker cache; re-allocated from etcd after container recreation
      - id-data:/app/data
    depends_on:
      nacos:
        condition: service_healthy
      etcd:
        condition: service_healthy
    # Graceful shutdown: after SIGTERM the program revokes its lease and immediately releases the worker slot
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - infra                # ID generation only, no external traffic, no edge needed

  devops-system:
    build:
      context: ..
      dockerfile: devops-system/Dockerfile
    image: devops-system:latest
    expose:
      - "9999"                # gateway/container network access only; not published to the host
    environment:
      APP_ENV: prod
    volumes:
      - ./config/system-prod.yaml:/app/config/devops-system-prod.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      devops-id:
        condition: service_started
    restart: unless-stopped
    networks:
      - edge                 # the gateway's only ingress: 9999 is exposed on this network only
      - infra                # access mysql/redis/nacos; keeps egress via edge

  devops-system-gray:
    build:
      context: ..
      dockerfile: devops-system/Dockerfile
    image: devops-system:latest
    profiles: ["gray"]
    environment:
      APP_ENV: prod
    volumes:
      - ./config/system-gray-bootstrap.yaml:/app/config/bootstrap.yaml:ro
      - ./config/system-gray-prod.yaml:/app/config/devops-system-gray-prod.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      devops-id:
        condition: service_started
    restart: unless-stopped
    networks:
      - edge
      - infra

networks:
  # Traffic-ingress network: gateway and business services only. Infrastructure containers
  # are not on it, so they cannot bypass the gateway to reach devops-system:9999 directly.
  edge:
  # Middleware network: internal: true means containers have no external egress and can
  # only be reached by services on the same network.
  infra:
    internal: true

volumes:
  mysql-data:
  nacos-data:
  redis-data:
  etcd-data:
  id-data:
