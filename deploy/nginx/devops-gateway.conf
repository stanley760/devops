# 统一入口边缘层（Nginx）
#
# 为什么需要这一层：Higress 的路由按 (host, path) 匹配，B 端在 api.devops.local、
# C 端在 user-api.devops.local。浏览器只能发一个 Host，所以要么让前端带两个域名
# （跨域 + 两套 baseURL），要么在边缘把两个域合并成一个对外入口。这一层就是后者：
#
#   浏览器 ──▶ http://devops.local:8081/            (Nginx 边缘，唯一入口)
#              ├─ /            → SPA 静态资源
#              ├─ /portal/     → C 端门户 SPA
#              ├─ /system/...  → Higress:8080  Host: api.devops.local
#              └─ /user/...    → Higress:8080  Host: user-api.devops.local
#
# 关键点：转发时必须显式写回 Host（proxy_set_header Host）。
# 不写的话 Nginx 默认会把 Host 改成 upstream 的名字/地址（$proxy_host），
# Higress 就匹配不到任何路由规则 → 404。
#
# 同源部署还顺带消除了 CORS：前端与 API 同源，浏览器的 CORS 预检根本不会发生，
# 网关侧的 cors wasm 插件只对真正跨域的来源生效。

upstream higress_gateway {
    # all-in-one 容器内的网关监听 8080
    server higress:8080;
    keepalive 32;
}

# B 端：用户权限系统
server {
    listen 8081;
    server_name devops.local;

    client_max_body_size 20m;

    # —— B 端 API：转发到网关并改写 Host ——
    location /system/ {
        proxy_pass http://higress_gateway;
        proxy_http_version 1.1;
        # ⚠️ 必须显式写回网关路由用的域名，否则 Higress 匹配不到 host 规则
        proxy_set_header Host api.devops.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # —— C 端 API：C 端用户服务 ——
    location /user/ {
        proxy_pass http://higress_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host user-api.devops.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # —— 静态资源 ——
    # 后台管理 SPA（构建产物根目录）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 前端路由回退：未命中的路径一律交给 index.html
        try_files $uri $uri/ /index.html;
    }

    # C 端门户（构建产物 portal 子目录，portal.html 作为其入口）
    location /portal/ {
        alias /usr/share/nginx/html/portal/;
        index portal.html;
        try_files $uri $uri/ /portal/portal.html;
    }

    # 静态资源长缓存；带 hash 的文件名可安全长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
