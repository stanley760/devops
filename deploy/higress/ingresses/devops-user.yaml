# C-side main route: authenticated business endpoints only.
#
# Differences from the B-side devops-system.yaml:
#   - Separate domain user-api.devops.local: C-side and B-side traffic profiles differ (large user
#     volume, simple endpoints, almost no back-office auditing), so they need separate rate limiting,
#     separate gray release, and separate access logs. Sharing one domain would make gray and
#     rate-limit policies hard to tell apart.
#   - Separate prefix /user: symmetric with the backend systemAPIPrefix (see devops-user/internal/router).
#   - Destination port 10000.
#
# Auth: jwt-auth-user-2.0.0.yaml mounts on this route via the ingress name in matchRules.
# login/register/jwks are served by devops-user-public.yaml (anonymous), bypassed via longest-prefix matching.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-user
  namespace: higress-system
  annotations:
    higress.io/destination: devops-user.DEVOPS-GROUP.public.nacos:10000
  labels:
    higress.io/resource-definer: higress
spec:
  ingressClassName: higress
  rules:
    - host: user-api.devops.local
      http:
        paths:
          # C-side business endpoints (incl. /user/api/v1/auth/logout and /user/api/v1/profile).
          # Ops endpoints (/metrics /apidoc /healthz /readyz) are not exposed via the public gateway.
          - path: /user
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # Verification public key: for other services' self-verification and manual troubleshooting, not business traffic.
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default