apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system
  namespace: higress-system
  annotations:
    higress.io/destination: devops-system.DEVOPS-GROUP.public.nacos:9999
    # Traffic-ingress containment is now JWT-based:
    #   - Gateway side: wasmplugins/jwt-auth-2.0.0.yaml verifies the Authorization header
    #     and, via claims_to_headers, overrides and injects internal headers such as
    #     X-Tenant-ID / X-Jwt-Uid;
    #   - Application side: devops-infra/security/gateway.Enforce independently verifies the JWT.
    #
    # The former "inject a static X-Gateway-Token + constant-time comparison" mechanism
    # has been removed: that credential expressed no identity, had no expiry and no
    # revocation, leaked = unlimited replay, and required maintaining a shared secret
    # across the ingress and configs.
    # login/refresh/jwks.json are served by devops-system-public.yaml (anonymous),
    # bypassing jwt-auth via Higress longest-prefix matching — the plugin mounts per
    # Ingress resource and does not support path matching.
  creationTimestamp: "2026-09-28T09:06:38Z"
  labels:
    higress.io/domain_higress-default-domain: "true"
    higress.io/resource-definer: higress
  managedFields:
  - apiVersion: networking.k8s.io/v1
    fieldsType: FieldsV1
    fieldsV1:
      f:metadata:
        f:annotations:
          .: {}
          f:higress.io/destination: {}
          f:higress.io/ignore-path-case: {}
          f:higress.io/match-method: {}
        f:labels:
          .: {}
          f:higress.io/domain_higress-default-domain: {}
          f:higress.io/resource-definer: {}
      f:spec:
        f:ingressClassName: {}
        f:rules: {}
    manager: Kubernetes Java Client
    operation: Update
    time: "2026-09-28T09:06:38Z"
  name: devops-system
  namespace: higress-system
  resourceVersion: "1"
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # Route only the business API and JWKS (the Higress jwt-auth plugin fetches the verification public key).
          # Ops endpoints (/metrics /apidoc /healthz /readyz) are internal-only and must not be exposed via the public gateway.
          - path: /system
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
