# Dedicated route for anonymous endpoints: carries the three endpoints exempted from the jwt-auth plugin.
#
# Why it must be a separate ingress: jwt-auth's matchRules support only the ingress / domain /
# service fields and **do not support URL path matching**. The main route devops-system hangs under
# the /system prefix, and the login endpoint /system/api/v1/auth/login falls inside that prefix.
# Mounting the plugin on the main route would force JWT verification on login → nobody could log in;
# and since access-token expiry is the premise of refresh, blocking refresh too would mean never
# getting a new token (system self-lockout).
#
# Solution: split the three anonymous endpoints into a separate ingress; Higress matches it via
# **longest prefix matching**, thereby bypassing the jwt-auth mounted on devops-system.
#
# Paths must be written in full: under prefix matching /system/api/v1/auth/login hits this route,
# and /system/api/v1/auth/refresh likewise. The two cannot be merged into /system/api/v1/auth,
# otherwise other endpoints under that prefix (e.g. change-password) would be exempted too.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system-public
  namespace: higress-system
  annotations:
    # Same destination as the main route. Traffic-ingress identity: anonymous endpoint; credential verification is handled by the login endpoint itself.
    # The old annotation "deliberately do not inject X-Gateway-Token" is now moot — the static identity header mechanism was removed entirely.
    higress.io/destination: devops-system.DEVOPS-GROUP.public.nacos:9999
  labels:
    higress.io/resource-definer: higress
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # Login: issues access + refresh tokens; must be anonymous.
          - path: /system/api/v1/auth/login
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # Captcha issuance: the login page fetches a captcha challenge before submitting
          # credentials, and the caller has no token yet — must be anonymous like login.
          - path: /system/api/v1/auth/captcha
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # Refresh: the only way out after access-token expiry; must be anonymous.
          - path: /system/api/v1/auth/refresh
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # Verification public key: for other services' self-verification and manual troubleshooting, not business traffic.
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default