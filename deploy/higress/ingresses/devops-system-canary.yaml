apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system-canary
  namespace: higress-system
  annotations:
    higress.io/canary: "true"
    # ⚠️ Do not use higress.io/canary-weight for the gray release.
    # The gray instance is not started by default in the dev stack, so once the weight takes effect
    # Envoy picks an "outbound|8080||devops-system-gray..." cluster that does not exist in CDS
    # (the service has zero instances in Nacos) → the hit request gets 503 no_cluster (response_flags=NC),
    # i.e. roughly 10% of page requests fail randomly.
    # Instead, only switch to gray when explicitly requested (Header > Cookie), and the default
    # 100% stays on the baseline instance; a 503 can only appear on requests that carry the gray tag.
    higress.io/canary-by-header: "x-canary"
    higress.io/canary-by-header-value: "true"
    higress.io/canary-by-cookie: "canary"
    # The port must be written explicitly: when omitted, Envoy parses the target as port 8080,
    # which is not the port the gray instance listens on, so the request cannot reach the backend.
    higress.io/destination: devops-system-gray.DEVOPS-GROUP.public.nacos:9998
    # Traffic-ingress identity is expressed by the JWT claims injected by the jwt-auth plugin; no static identity header annotation needed.
    #
    # Note: jwt-auth's matchRules mount per Ingress resource; the canary route is merged into
    # the main route devops-system by Higress, so the main route's matching rules already cover
    # gray traffic — no need to repeat the plugin config here.
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # Same scope as devops-system.yaml: business API and JWKS only; ops endpoints are not exposed via the public gateway.
          # ⚠️ This was previously miswritten as /api, but the backend huma routes hang under the /system
          # prefix (systemAPIPrefix) — requests matching that prefix were all 404'd by the backend,
          # so the canary weight split never actually took effect.
          - path: /system
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
