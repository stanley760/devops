apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system-canary
  namespace: higress-system
  annotations:
    higress.io/canary: "true"
    higress.io/canary-weight: "10"
    higress.io/destination: devops-system-gray.DEVOPS-GROUP.public.nacos
    # Traffic-ingress identity is expressed by the JWT claims injected by the jwt-auth plugin; no static identity header annotation needed.
    #
    # Note: jwt-auth's matchRules mount per Ingress resource; the canary route is merged into
    # the main route devops-system by Higress, so the main route's matching rules already cover
    # gray traffic — no need to repeat the plugin config here.
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # Same scope as devops-system.yaml: business API and JWKS only; ops endpoints are not exposed via the public gateway.
          # ⚠️ This was previously miswritten as /api, but the backend huma routes hang under the /system
          # prefix (systemAPIPrefix) — requests matching that prefix were all 404'd by the backend,
          # so the canary 10% weight split never actually took effect.
          - path: /system
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
