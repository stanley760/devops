# Dedicated route for gray instances: gray.devops.local goes 100% straight to devops-system-gray,
# for targeted verification of gray versions (no canary weight randomness).
# Same scope as the main route: business API and JWKS only; ops endpoints are not exposed via the public gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system-gray-route
  namespace: higress-system
  annotations:
    # The port must be written explicitly: when omitted, Envoy parses the target as port 8080,
    # which is not the port the gray instance listens on (devops-system/config/bootstrap-gray.yaml → 9998),
    # so the request cannot reach the backend.
    higress.io/destination: devops-system-gray.DEVOPS-GROUP.public.nacos:9998
    # Traffic-ingress identity is expressed by the JWT claims injected by the jwt-auth plugin; no static identity header annotation needed.
    # This ingress is explicitly listed in jwt-auth's matchRules, so gray-targeted traffic is likewise authenticated.
spec:
  ingressClassName: higress
  rules:
    - host: gray.devops.local
      http:
        paths:
          # ⚠️ This was previously miswritten as /api, but the backend huma routes hang under the /system
          # prefix (systemAPIPrefix) — requests matching that prefix were all 404'd by the backend,
          # so gray-targeted verification never actually reached the gray instance.
          - path: /system
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
