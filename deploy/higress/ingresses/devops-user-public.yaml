# Route for C-side anonymous endpoints: carries the endpoints exempted from the jwt-auth-user plugin.
#
# Why it must be a separate ingress: jwt-auth's matchRules support only ingress / domain /
# service and **do not support URL path matching**. The main route devops-user hangs under
# the /user prefix, and login /user/api/v1/auth/login falls inside that prefix. Mounting the
# plugin on the main route would force JWT verification on login → the user has no token yet →
# nobody could register/log in (system self-lockout).
#
# Solution: split the anonymous endpoints into a separate ingress; Higress matches it via
# **longest prefix matching**, thereby bypassing the jwt-auth mounted on devops-user.
#
# Paths must be written in full and cannot be merged:
#   - Merging into /user/api/v1/auth would exempt logout as well (logout should require auth,
#     otherwise anyone could kick others offline);
#   - Merging into /user/api/v1 would exempt profile as well (severe privilege escalation).
#
# The host is distinct from the B-side api.devops.local: both services serve /.well-known/jwks.json,
# and under the same host longest-prefix matching cannot tell them apart — one would be hit at random.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-user-public
  namespace: higress-system
  annotations:
    # Anonymous endpoint; credential verification is handled by the login endpoint itself.
    higress.io/destination: devops-user.DEVOPS-GROUP.public.nacos:10000
  labels:
    higress.io/resource-definer: higress
spec:
  ingressClassName: higress
  rules:
    - host: user-api.devops.local
      http:
        paths:
          # Login: issues access token; must be anonymous.
          - path: /user/api/v1/auth/login
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # Register: open endpoint; must be anonymous.
          - path: /user/api/v1/auth/register
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # Refresh: the caller's access token has already expired, so requiring a JWT would mean
          # it can never be refreshed — must be anonymous just like login.
          - path: /user/api/v1/auth/refresh
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # OAuth callback: the third-party platform redirects here, and the user has no local token yet,
          # so it must be anonymous. Security relies on one-time state verification (CSRF protection),
          # not on a login session.
          #
          # ⚠️ The path must be exact: /user/api/v1/oauth/{provider}/callback.
          # If merged into /user/api/v1/oauth, then bind/start — which require login —
          # would also be exempted → an unauthenticated user could initiate a binding hijack.
          - path: /user/api/v1/oauth/github/callback
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /user/api/v1/oauth/google/callback
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /user/api/v1/oauth/wechat/callback
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          # List available third-party login methods (the frontend renders entry points from this).
          - path: /user/api/v1/oauth/providers
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default

          # Verification public key: not business traffic.
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default