apiVersion: networking.higress.io/v1
kind: McpBridge
metadata:
  name: default
  namespace: higress-system
spec:
  registries:
    - name: devops-nacos
      type: nacos2
      domain: nacos
      port: 8848
      nacosNamespaceId: public
      nacosGroups:
        - DEVOPS_GROUP
    # Redis for the rate-limit plugin (cluster-key-rate-limit): dns service source.
    # protocol uses tcp — McpBridge 2.2.3 does not recognize the redis protocol (reports invalid protocol:redis).
    # domain must be a full dotted domain name, corresponding to the redis network alias in compose.
    - name: devops-redis
      type: dns
      protocol: tcp
      domain: redis.devops.local
      port: 6379
