# Cluster rate limiting (Redis cluster-level counting, shared across gateway instances): 100 QPS per IP, 429 when exceeded.
# Rescued into git from the higress-data volume on 2026-09-30 (it previously existed only in the runtime volume, violating the git-as-source-of-truth convention).
# Depends on the devops-redis DNS service source in mcpbridges/default.yaml (the redis.devops.local network alias,
# see the redis service in docker-compose-dev.yml). Passwords are injected from secrets management in production, never committed in plaintext.
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: devops-cluster-key-rate-limit
  namespace: higress-system
spec:
  defaultConfig:
    redis:
      service_name: devops-redis.dns
      service_port: 6379
      password: "123456"
  # ⚠️ all-in-one（dev）形态下 url 必须指向本地 plugin-server：官方文档给的
  # oci://... 需要容器去远端仓库拉取，拉不到时 ECDS 配置下发被拒，
  # Envoy 拿不到任何有效配置 → 监听端口根本不会打开（整个网关不可用，
  # 而不只是这个插件失效）。其余插件同理，都指向 localhost:8002。
  url: http://localhost:8002/plugins/cluster-key-rate-limit/1.0.0/plugin.wasm
  matchRules:
    - ingress:
        - devops-system
        - devops-system-gray-route
      # The config after a matchRules hit replaces defaultConfig entirely,
      # so the redis connection info must be repeated in every matched rule.
      config:
        redis:
          service_name: devops-redis.dns
          service_port: 6379
          password: "123456"
        rule_name: devops-system
        rule_items:
          - limit_by_per_ip: from-remote-addr
            limit_keys:
              - key: 0.0.0.0/0
                query_per_second: 100
        rejected_code: 429
        show_limit_quota_header: true
