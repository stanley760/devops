# Geo IP: looks up the client IP's location (country/province/city/ISP) and injects X-Higress-Geo-* request
# headers (URL-escaped), which the devops-system login audit (t_system_login_log) reads and persists.
# ip_source_type=origin-source: takes the downstream connection's real source address (client connects
# directly to gateway 8080, no front LB); for intranet IPs the plugin injects "Intranet IP". Previously
# configured as header+X-Real-Ip — envoy never writes that header, so the plugin errored on every request
# and injected no headers; fixed on 2026-09-30.
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: geo-ip-1.0.0
  namespace: higress-system
  labels:
    higress.io/resource-definer: higress
    higress.io/wasm-plugin-built-in: "true"
    higress.io/wasm-plugin-category: o11y
    higress.io/wasm-plugin-name: geo-ip
    higress.io/wasm-plugin-version: 1.0.0
spec:
  defaultConfig:
    ip_protocol: ipv4
    ip_source_type: origin-source
  defaultConfigDisable: false
  failStrategy: FAIL_OPEN
  phase: AUTHN
  priority: 440
  url: http://localhost:8002/plugins/geo-ip/1.0.0/plugin.wasm
