# JWT authentication (traffic-ingress identity verification, replacing the static X-Gateway-Token)
#
# Why not the console routing panel's "auth method": that is a shortcut to the built-in key-auth and only
# accepts a static list of consumer names — still a static key at heart, which is exactly what this file
# replaces. jwt-auth is a standalone WasmPlugin mounted onto routes via the ingress field of matchRules.
#
# ⚠️ global_auth must be false. This is the most critical line in this file:
#   true  = the plugin applies globally to ALL routes in the gateway, including
#           /system/api/v1/auth/login → the login endpoint requires a JWT, but the user
#           has no token yet → nobody can log in (system self-lockout);
#           likewise refresh is blocked, so a new token can never be obtained after expiry.
#   false = only the routes matched by matchRules take effect, so devops-system-public is exempted.
# The docs are explicit that within one rule "authz config" and "authn config" cannot coexist, hence no allow here.
#
# Anonymous endpoints are bypassed via a separate ingress + Higress longest-prefix matching (see
# ingresses/devops-system-public.yaml): the plugin's matchRules do not support URL path matching.
#
# Public key source: the jwt.signing_key in devops-system/config/devops-system-dev.yaml
# (PKCS#8 RSA 2048), with n exported via `openssl rsa -noout -modulus`, e=65537 (AQAB);
# kid/iss match the signer exactly, verified end to end with a "private sign → public verify"
# closed loop (Verified OK). After a production key rotation this block must be re-exported,
# otherwise everything returns 401. The plugin contains only the public key, so it is safe to commit.
#
# ⚠️ In the all-in-one (dev) form the url must point at the local plugin-server; the official docs'
#   oci://...:2.0.0 cannot be used. oci:// requires the controller to actively pull the image to disk,
#   which does not trigger under the file backend + all-in-one.
#   The other plugins in this directory (cors / geo-ip) likewise all use localhost:8002 — stay consistent.
#   In the K8s form, if the controller can pull images, oci:// may be used again. It is verified that the
#   plugin-server bundles this plugin (GET /plugins/jwt-auth/2.0.0/plugin.wasm returns 200, ~2.9MB;
#   the large size corresponds to the wasm-go implementation, so remote_jwks is usable).
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: jwt-auth-2.0.0
  namespace: higress-system
  # The console "plugin config" page groups and displays resources by label; same structure as the cors plugin; absence does not affect loading.
  labels:
    higress.io/resource-definer: higress
    higress.io/wasm-plugin-name: jwt-auth
    higress.io/wasm-plugin-built-in: "true"
spec:
  url: http://localhost:8002/plugins/jwt-auth/2.0.0/plugin.wasm
  # Must be explicitly false (the default is already false): when true the whole defaultConfig is
  # disabled, and combined with the matchRules.config: {} below the plugin ends up with no consumer
  # config, so even real tokens get 403 Access Denied. Keeping this field pins the relationship with
  # defaultConfigDisable in the config so future editors do not mistakenly add true.
  defaultConfigDisable: false
  defaultConfig:
    global_auth: false
    consumers:
      - name: devops-system
        # Must match the iss in the payload verbatim, otherwise 401 Jwt verification fails.
        issuer: devops
        jwks: |
          {
            "keys": [
              {
                "kty": "RSA",
                "e": "AQAB",
                "use": "sig",
                "kid": "devops-system-rs256-1",
                "alg": "RS256",
                "n": "xxX85-SS5TQOGv5LICViCm-XbOeHzmaKhKxmikZOnN1vPHLTgALG3BNZUL6dAhJlQYs2Fi78vJQIZ5dx2luNrDrpeXjY7BR1dj5_1X_TMgKHOUDLC68E1n4SRLGsQ_YzEr3kXKwxUWWM0wPKFkp__Lk8Jb0iD7_J7krvEHZ4h4BkK_VzsDG41nL2lc8M-oDF3P3QN9WV0XRGDDnihgnvrvNkD1KCR5WDgoKHYjQ-QscI4aSUSoFkjeDpE1YLa4KcJ5KeZB00m26217AusJl6pzl9h_4nz10Y4TsswVkSC88fS_CqTpyyB2GWAvbPyDsnteR5MQySJXt0dQjn4JUUIQ"
              }
            ]
          }
        # claims → internal request headers. override defaults to true, so client-forged headers with the same name get overwritten,
        # the same principle as request-header-control-update.
        claims_to_headers:
          - claim: uid
            header: X-Jwt-Uid
          - claim: username
            header: X-Jwt-Username
          # sid is required: without it the backend cannot check the Redis session state, and
          # "kick offline" would only take effect once the access token expires (2h).
          - claim: sid
            header: X-Jwt-Sid
          - claim: tid
            header: X-Tenant-ID
          - claim: tcode
            header: X-Tenant-Code
        # Take the JWT from Authorization: Bearer <token> (the default; stated explicitly to avoid relying on the implicit default).
        from_headers:
          - name: Authorization
            value_prefix: "Bearer "
        clock_skew_seconds: 60
        # Must be true: the backend still needs to verify Redis session revocation and tenant status,
        # and must not trust tenant identity based solely on the gateway-injected X-Tenant-ID.
        keep_token: true
  # ⚠️ The ingress name carries no namespace prefix. The all-in-one file backend uses the filename as the
  #    resource name, so writing higress-system/devops-system would never match and the plugin would
  #    silently do nothing (no logs at all).
  matchRules:
    # Mount only on the main route and the gray-targeted route; canary is merged into the main route by Higress, no need to list it separately.
    # Deliberately excludes devops-system-public (login / refresh / jwks.json must be anonymous).
    - ingress:
        - devops-system
        - devops-system-gray-route
      # The docs are explicit: within one rule "authz config" and "authn config" cannot coexist.
      # So the rule only writes allow (authorization: which consumer may access this route);
      # the authn config (consumers/jwks) lives entirely in the instance-level defaultConfig.
      #
      # ⚠️ Verified pitfall on Higress 2.2.3: if the consumers array is inlined in matchRules.config,
      #   pilot fails to parse and **silently skips the whole plugin** — no error logs,
      #   gateway.log never shows fetching image plugins/jwt-auth, and requests pass straight through to the backend.
      #   To verify the plugin is really loaded: grep 'fetching image plugins/jwt-auth' gateway.log,
      #   or check whether a token-less request returns jwt-auth's "Jwt is missing"
      #   (an application-layer 401 is the envelope format {"code":401,...}; a plugin 401 is the plain text Jwt is missing).
      #
      # ⚠️ config also cannot contain just {}: that would replace defaultConfig entirely, emptying the
      #   consumer list, so even real tokens would get 403 Access Denied. It must carry allow pointing
      #   back to the consumer in defaultConfig.
      config:
        allow:
          - devops-system
