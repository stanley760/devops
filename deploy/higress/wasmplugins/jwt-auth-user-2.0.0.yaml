# JWT authentication (C-side devops-user) — parallel to and independent from devops-system's jwt-auth-2.0.0.yaml
#
# ## Why it must be a separate plugin instance (rather than merged into the devops-system one)
#
# The two have different signers (issuer: devops vs devops-user, and different kids). If merged into one
# consumers list, tokens from both sides would go through this plugin's verification:
#   - consumer matching is by issuer + kid, so in theory they would not match each other;
#   - but once the config is written wrong (the issuer copied as the same value), a B-side token could
#     access C-side endpoints, with **no error at all** — the most dangerous kind of config drift.
# Separate files + separate plugin-server paths also let matchRules control the effective scope separately.
#
# ## Three must-not-change items in this plugin (all have caused pitfalls)
#
# 1. `metadata.name` **cannot be jwt-auth**: pilot would take the Istio native branch
#    (logs show `--tokenManagerPlugin=""` and `JwtRule: ""`), and all-in-one 2.2.3
#    recognizes neither security.istio.io resources nor an envoy jwt_authn filter, so nothing loads.
#    Here it is named `jwt-auth-user-2.0.0`.
# 2. `url` **must use the local plugin-server**: `oci://` requires the controller to actively pull and persist,
#    which does not trigger under the file backend + all-in-one. Consistent with the other plugins in this directory.
# 3. **The consumers array cannot be inlined in `matchRules.config`** (pilot fails to parse and silently skips the whole
#    plugin, with no logs); nor can it be just `{}` (that replaces defaultConfig entirely, so even real tokens get
#    403 Access Denied). It must carry allow pointing back to the consumer in defaultConfig.
#
# To verify the plugin is really loaded:
#   docker compose -f deploy/docker-compose-dev.yml exec higress \
#     sh -c 'grep -c "fetching image plugins/jwt-auth" /var/log/higress/gateway.log'
# Or check whether a token-less request returns the **plain text** `Jwt is missing`
# (the envelope format {"code":401,...} means it is the application layer; the plugin is not in effect).
#
# Public key source: the jwt.signing_key in devops-user/config/devops-user-dev.yaml
# (PKCS#8 RSA 2048) with n exported, e=65537 (AQAB); kid=devops-user-rs256-1 and
# iss=devops-user match the signer exactly, verified end to end with a "private sign → public verify"
# closed loop (Verified OK). After a production key rotation this block must be re-exported, otherwise everything returns 401.
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: jwt-auth-user-2.0.0
  namespace: higress-system
  labels:
    higress.io/resource-definer: higress
    higress.io/wasm-plugin-name: jwt-auth
    higress.io/wasm-plugin-built-in: "true"
spec:
  url: http://localhost:8002/plugins/jwt-auth/2.0.0/plugin.wasm
  # Explicitly false: the relationship with matchRules.config must be pinned in the config to avoid future editors mistakenly adding true.
  defaultConfigDisable: false
  defaultConfig:
    # ⚠️ Must be false: true makes the plugin apply globally to **all** routes in the gateway,
    #    including the login/register carried by devops-user-public → the user has no token yet → nobody can log in.
    global_auth: false
    consumers:
      - name: devops-user
        # Must match the iss in the payload verbatim, otherwise 401 Jwt verification fails.
        # ⚠️ Must not be changed to devops: that would make it match B-side tokens, causing cross-side privilege escalation.
        issuer: devops-user
        jwks: |
          {
            "keys": [
              {
                "kty": "RSA",
                "e": "AQAB",
                "use": "sig",
                "kid": "devops-user-rs256-1",
                "alg": "RS256",
                "n": "zfxyyT7KcMsbAicxsv1GNQm-GkCVV1ogltuYDPD1JxN8V8VsvwLvmHolftqXTQaGh-85jaGPPD9_Y3Qc-Lwwz7bC2ej7ffnPdL07RHuublCaEGFvDjlZ8ZdX3H_UyCfatVmDfkNT0YIhm0nlvLXXEzAuFniMGO7WoAOZ8eQgloBdUxjhzbxYOOD0ATqw_JFUVW-5Dr5KYl5_j3oUFpTBgFilJNtnLAyGEm08mvdzZAuvFdbL6fo97aink7HP_moEvGPH3Xnk57rZ-FIEY3QI86jU2UcFskS9NZwyzaEnO6o2bUKO8lybecXOrknKNO34r2ikmOSrtmdsyHoM6ZKXdQ"
              }
            ]
          }
        # claims → internal request headers. override defaults to true, so client-forged headers with the same name get overwritten.
        # ⚠️ The C side **deliberately does not inject tid/tcode**: devops-user has no tenant model,
        # and injecting tenant headers would instead mislead the backend into thinking a tenant context exists.
        claims_to_headers:
          - claim: uid
            header: X-Jwt-Uid
          - claim: username
            header: X-Jwt-Username
        from_headers:
          - name: Authorization
            value_prefix: "Bearer "
        clock_skew_seconds: 60
        # Must be true: the backend still needs to verify the Redis session state (immediately invalid after logout/ban),
        # and must not trust requests based solely on the gateway-injected identity headers.
        keep_token: true
  # ⚠️ The ingress name carries no namespace prefix (the all-in-one file backend uses the filename as the resource name).
  matchRules:
    # Mount only on the C-side main route; deliberately excludes devops-user-public (login/register/jwks must be anonymous).
    - ingress:
        - devops-user
      # The docs are explicit: within one rule "authz config" and "authn config" cannot coexist.
      # So the rule only writes allow; the authn config lives entirely in defaultConfig.
      config:
        allow:
          - devops-user