# Single-node Docker dev environment. For production deployment use docker-compose.yml.
#
# —— Isolation differences vs the production compose (pay attention) ——
# In production, devops-system runs in a container and the edge/infra dual network can
# enforce "gateway-only ingress". In dev, business services run via go run on the host
# at 127.0.0.1:9999, and all middleware publishes host ports for local debugging, so
# network isolation is **not** possible (it would sever the debugging path).
# Dev traffic containment relies on application-layer guards only, and system-dev.yaml
# sets require_token=false — direct local curl is deliberately allowed. For the production
# security boundary see docker-compose.yml and higress/README.md.
name: devops_dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: devops
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspwd
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpwd"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      default:
        aliases:
          # Full domain-name format, resolved by the Higress DNS service source (devops-redis in mcpbridges/default.yaml)
          - redis.devops.local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # One-shot config seeding: copies the git-managed resource directories under deploy/higress
  # into the named volume (/data), avoiding the high CPU caused by a Windows bind mount on /data.
  # up does not re-run completed containers; after changing configs use dev.sh sync to force a
  # re-seed + gateway restart. Always edit the yaml files under deploy/higress.
  higress-init:
    image: busybox:1.36
    volumes:
      - ./higress:/src:ro
      - higress-data:/data
    command:
      - sh
      - -c
      - tar cf - -C /src mcpbridges ingresses services wasmplugins | tar xf - -C /data

  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.2.3
    environment:
      # Keep the built-in prometheus/loki/promtail/grafana off (off by default; stated
      # explicitly to pin the intent); monitoring uses this compose stack's external
      # prometheus/grafana
      O11Y: "off"
      # envoy worker thread count; the default of 16 is excessive for a dev machine
      GATEWAY_CONCURRENCY: "2"
    ports:
      - "8001:8001"           # console
      - "8080:8080"           # HTTP gateway
      - "8443:8443"           # HTTPS gateway
    volumes:
      - higress-data:/data
    # K8s-style service FQDNs -> host LAN IPv4: business services run on the host in
    # dev, the gateway container reaches them through these /etc/hosts entries.
    # host.docker.internal is blocked by the Windows firewall (same as prometheus's
    # devops-host), so an explicit LAN IP (HOST_IP, deploy/.env) is required.
    extra_hosts:
      - "devops-system.devops.svc.cluster.local:${HOST_IP:-172.16.60.150}"
      - "devops-user.devops.svc.cluster.local:${HOST_IP:-172.16.60.150}"
      - "devops-system-gray.devops.svc.cluster.local:${HOST_IP:-172.16.60.150}"
    depends_on:
      higress-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g 

  # etcd: storage for devops-id snowflake slots (the Higress all-in-one does not depend on it).
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
    ports:
      - "2379:2379"           # the local devops-id process connects via 127.0.0.1:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # —— Observability (dev local stack): Tempo tracing + Loki logs + Prometheus scraping + Grafana visualization ——
  # Grafana 12.x ships the Drilldown apps (Metrics / Logs / Traces) built in:
  #   - Metrics Drilldown browses Prometheus metrics queryless, grouped by metric-name
  #     prefix (works against the existing Prometheus datasource, zero extra config);
  #   - Logs Drilldown groups by service.name — fed by Loki, which receives the services'
  #     slog output over OTLP (observability.OTLPLogEndpoint → loki:4318);
  #   - Traces Drilldown shows Rate/Errors/Duration — fed by Tempo, whose metrics-generator
  #     remote-writes span RED metrics into Prometheus.
  # Tempo replaces Jaeger on the same OTLP ports (4317/4318), so service configs are unchanged.

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"           # Tempo HTTP API (TraceQL)
      - "4317:4317"           # OTLP gRPC
      - "4318:4318"           # OTLP HTTP (service trace egress)
    # The Tempo image is distroless: no shell, no curl/wget — a container-level
    # HTTP probe is impossible. Liveness is checked via the binary itself; the
    # real readiness signal comes from Grafana's Tempo datasource health check
    # (which queries /status) and from the service's own logs.
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # Log backend: receives OTLP logs from the services (log.export endpoint loki:4318)
  # and serves Logs Drilldown. service.name → index label service_name.
  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"           # Loki HTTP API / readiness
    # The Loki image is distroless: no shell, no curl/wget — a container-level
    # HTTP probe is impossible. Liveness is checked via the binary itself; the
    # real readiness signal comes from Grafana's Loki datasource health check.
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    environment:
      # The Kiri runtime injects an unreachable host proxy into containers.
      # Clear it so Prometheus can scrape services and exporters directly.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    extra_hosts:
      # Prometheus reaches host-run services through the LAN address; the
      # host.docker.internal gateway is blocked by the Windows firewall.
      - "devops-host:${HOST_IP:-172.16.60.150}"
    # command replaces the image default CMD entirely, so the config file and storage path must be carried along
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d   # no persistent volume in dev; just cap in-container growth
      # Accept Tempo's metrics-generator remote writes (traces_spanmetrics_* — the
      # Rate/Errors/Duration data behind Traces Drilldown)
      - --web.enable-remote-write-receiver
      # Exemplars link metric samples back to Tempo traces
      - --enable-feature=exemplar-storage
      # Probes /readyz so the devops_readiness metric reflects the real dependency
      # state (the orchestrator consumes the same endpoint). Without this the
      # metric only appears once something else scrapes /readyz.
      - --enable-feature=expand-external-labels
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    # No dependency on business services: Prometheus tolerates missing targets with retries, supporting partial startup

  # WSL2/Docker VM metrics (not the Windows host). Keep this bind mount
  # read-write: node-exporter otherwise reports the root filesystem read-only.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(var/lib/kiri|dev|proc|sys)($|/)
      - --collector.filesystem.fs-types-exclude=^(sysfs|proc|devtmpfs|tmpfs|cgroup.*|overlay)$
    pid: host
    volumes:
      - /:/host
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  # MySQL server metrics; credentials are the development defaults from mysql.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    command:
      - --config.my-cnf=/cfg/.my.cnf
    volumes:
      - ./prometheus/my.cnf:/cfg/.my.cnf:ro
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  # Redis keyspace metrics, separate from application cache hit/miss metrics.
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: "123456"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  # Alert egress: Prometheus pushes fired alerts here. Dev has no external integration,
  # so alerts are only visible in the UI (http://localhost:9093); production wires up a DingTalk/email webhook.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    # No dependency on business services: when Alertmanager is unreachable Prometheus only logs delivery errors; scraping is unaffected

  grafana:
    image: grafana/grafana:12.4.15
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # dev default password; prod uses SSO/secrets management
      # The Kiri runtime injects the host proxy (HTTP_PROXY=host.docker.internal:7890) into every
      # container; its NO_PROXY exemption list only covers localhost/host.docker.internal, so
      # Grafana's datasource requests to http://prometheus:9090 / tempo:3200 / loki:3100 get
      # routed through the proxy and fail. Clear the proxy vars explicitly: datasource traffic
      # stays inside the compose network.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  grafana-data:
  higress-data:
  tempo-data:
  loki-data: