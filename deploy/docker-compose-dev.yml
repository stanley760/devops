# Single-node Docker dev environment. For production deployment use docker-compose.yml.
#
# —— Isolation differences vs the production compose (pay attention) ——
# In production, devops-system runs in a container and the edge/infra dual network can
# enforce "gateway-only ingress". In dev, business services run via go run on the host
# at 127.0.0.1:9999, and all middleware publishes host ports for local debugging, so
# network isolation is **not** possible (it would sever the debugging path).
# Dev traffic containment relies on application-layer guards only, and system-dev.yaml
# sets require_token=false — direct local curl is deliberately allowed. For the production
# security boundary see docker-compose.yml and higress/README.md.
name: devops_dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: devops
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspwd
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpwd"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      default:
        aliases:
          # Full domain-name format, resolved by the Higress DNS service source (devops-redis in mcpbridges/default.yaml)
          - redis.devops.local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    expose:
      - "9848"
      - "9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m   # JVM is already capped at 256m; the container limit backs up off-heap overhead

  # One-shot config seeding: copies the git-managed resource directories under deploy/higress
  # into the named volume (/data), avoiding the high CPU caused by a Windows bind mount on /data.
  # up does not re-run completed containers; after changing configs use dev.sh sync to force a
  # re-seed + gateway restart. Always edit the yaml files under deploy/higress.
  higress-init:
    image: busybox:1.36
    volumes:
      - ./higress:/src:ro
      - higress-data:/data
    command:
      - sh
      - -c
      - tar cf - -C /src mcpbridges ingresses services wasmplugins | tar xf - -C /data

  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.2.3
    environment:
      # Keep the built-in prometheus/loki/promtail/grafana off (off by default; stated
      # explicitly to pin the intent); monitoring uses this compose stack's external
      # prometheus/grafana
      O11Y: "off"
      # envoy worker thread count; the default of 16 is excessive for a dev machine
      GATEWAY_CONCURRENCY: "2"
    ports:
      - "8001:8001"           # console
      - "8080:8080"           # HTTP gateway
      - "8443:8443"           # HTTPS gateway
    volumes:
      - higress-data:/data
    depends_on:
      nacos:
        condition: service_healthy
      higress-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g 

  # etcd: storage for devops-id snowflake slots (the Higress all-in-one does not depend on it).
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
    ports:
      - "2379:2379"           # the local devops-id process connects via 127.0.0.1:2379
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # —— Observability (dev local stack): Jaeger tracing + Prometheus scraping + Grafana visualization ——

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317"           # OTLP gRPC
      - "4318:4318"           # OTLP HTTP (service trace egress)
      - "16686:16686"         # Jaeger UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 30
    command: ["--memory.max-traces=20000"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g   # double insurance with max-traces: the data layer caps row count, the container layer caps memory
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    # command replaces the image default CMD entirely, so the config file and storage path must be carried along
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d   # no persistent volume in dev; just cap in-container growth
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    # No dependency on business services: Prometheus tolerates missing targets with retries, supporting partial startup

  # Alert egress: Prometheus pushes fired alerts here. Dev has no external integration,
  # so alerts are only visible in the UI (http://localhost:9093); production wires up a DingTalk/email webhook.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    # No dependency on business services: when Alertmanager is unreachable Prometheus only logs delivery errors; scraping is unaffected

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # dev default password; prod uses SSO/secrets management
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  etcd-data:
  grafana-data:
  higress-data: