# devops-id container environment override: mounted as /app/config/devops-id-prod.yaml inside the image, effective with APP_ENV=prod.
# Addresses are docker-compose service names (service discovery within the same network);
# for K8s deployment, replace them with the corresponding Service names or externally managed service addresses.
log:
  level: info
  dir: /app/logs
  console: true       # container standard: logs go to stdout, collected by docker/k8s log drivers
  format: json

nacos:
  enabled: true
  endpoints:
    - "nacos:8848"
  namespace: public
  group: "DEVOPS_GROUP"
  registry:
    service_name: "devops-id"

idgen:
  leaf_name: devops-id
  worker_cache: data

etcd:                 # snowflake worker coordination
  endpoints:
    - "etcd:2379"

# Production observability settings: sampling starts at 0.1; metrics go over a dedicated HTTP port, scraped only on the intranet.
# An empty otlp_endpoint means local spans are not reported; fill in its OTLP HTTP address after wiring up Jaeger/Tempo/otel-collector.
observability:
  otlp_endpoint: ""
  sampler_ratio: 0.1
  metrics_enabled: true
  metrics_listen: ":9991"
