# Docker container environment override (used by the one-shot migrate container only).
# Business services are started via local go run instead, loading devops-system/config/devops-system-dev.yaml from the repo (address 127.0.0.1).
log:
  level: debug
  dir: /app/logs
  console: true
  format: text

mysql:
  host: mysql
  port: 3306
  username: devops
  password: "devopspwd"
  database: devops

redis:
  host: redis
  port: 6379
  password: "123456"
  db: 0

nacos:
  enabled: true
  endpoints:
    - "nacos:8848"
  namespace: public
  group: "DEVOPS_GROUP"
  registry:
    service_name: "devops-system"

