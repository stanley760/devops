# Docker single-node dev environment config.
# Containers communicate via Compose service names; do not change to 127.0.0.1.
log:
  level: debug
  dir: /app/logs
  console: true
  format: text

nacos:
  enabled: true
  endpoints:
    - "nacos:8848"
  namespace: public
  group: "DEVOPS_GROUP"
  registry:
    service_name: "devops-id"

idgen:
  leaf_name: devops-id
  worker_cache: data

etcd:
  endpoints:
    - "etcd:2379"
  dial_timeout: 5s
  lease_ttl: 10s

# The gRPC service's metrics go over a dedicated HTTP port (the gRPC port cannot serve /metrics), for Prometheus scraping.
observability:
  otlp_endpoint: "http://jaeger:4318"
  sampler_ratio: 1.0
  metrics_enabled: true
  metrics_listen: ":9991"
