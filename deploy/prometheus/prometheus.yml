# Prometheus scrape config (mounted at /etc/prometheus/prometheus.yml in the dev compose stack).
# Business services run on the host; the Prometheus container reaches their /metrics via host.docker.internal:
#   devops-system: /metrics on HTTP port 9999 (alongside /healthz, not via Higress)
#   devops-id: the gRPC port cannot serve HTTP, so metrics go over a dedicated metrics port 9991
#   devops-user: /metrics on HTTP port 10000 (same port as the API, mounted before the gateway guard)
# Alerts: rules live in alerts.yml (same directory); fired alerts go to alertmanager:9093 in this compose stack.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: devops-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9999
          - host.docker.internal:9991
          - host.docker.internal:10000
  # Higress gateway Envoy metrics (enablePrometheusMerge merges istio stats)
  - job_name: higress-gateway
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["higress:15020"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
