# Prometheus 告警规则（dev compose 内挂载为 /etc/prometheus/alerts.yml）。
# 规则在 Prometheus 侧评估，命中后经 Alertmanager 路由（dev 无外部集成，
# 仅在 Alertmanager UI http://localhost:9093 可见；生产把 dev-sink 换成
# 钉钉/企业微信/邮件 webhook 即可）。
#
# 阈值为 dev 起步值，生产按 SLO 调整。指标名与 dashboard 同源：
#   http_server_requests_total     业务 HTTP RED（otelgin 自定义埋点）
#   rpc_client_call_duration_seconds   gRPC client（otelgrpc stats handler，devops-system/devops-user → devops-id）
#   go_sql_*                       MySQL 连接池（client_golang DBStatsCollector）
#   db_client_connections_*        Redis 连接池（redisotel）
#   auth_login_total/auth_register_total  认证业务指标（service 层 OTel counter）
# HTTP/认证规则按 service_name 分组告警，devops-system 与 devops-user 各自独立触发。
groups:
  - name: devops-availability
    rules:
      - alert: DevOpsScrapeTargetDown
        expr: up{job="devops-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "抓取目标失联 {{ $labels.instance }}"
          description: "Prometheus 连续 1 分钟无法抓取 {{ $labels.instance }} 的 /metrics，服务可能下线或网络不通。"

  - name: devops-service-slo
    rules:
      - alert: DevOpsHTTP5xxRateHigh
        expr: |
          sum by (service_name) (rate(http_server_requests_total{service_name=~"devops-(system|user)", status=~"5.."}[5m]))
            /
          sum by (service_name) (rate(http_server_requests_total{service_name=~"devops-(system|user)"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 错误率超 1%（{{ $labels.service_name }}）"
          description: "{{ $labels.service_name }} 5xx 占比持续 5 分钟超过 1%（当前 {{ $value | humanizePercentage }}）。"

      - alert: DevOpsHTTPP99High
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_request_duration_seconds_bucket{service_name=~"devops-(system|user)"}[5m])) by (le, route, service_name)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP P99 延迟超 1s（{{ $labels.service_name }} {{ $labels.route }}）"
          description: "{{ $labels.service_name }} 路由 {{ $labels.route }} 的 P99 延迟 {{ $value | humanize }} 持续 5 分钟超过 1s。"

      - alert: DevOpsGRPCClientErrorRateHigh
        expr: |
          (
            sum(rate(rpc_client_call_duration_seconds_count{rpc_response_status_code!="OK"}[5m])) or vector(0)
          ) / (
            sum(rate(rpc_client_call_duration_seconds_count[5m])) or vector(0)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "gRPC 客户端错误率超 5%"
          description: "调用 devops-id 的非 OK 状态占比持续 5 分钟超过 5%，发号缓冲正在被同步重试拖慢。"

  - name: devops-dependencies-use
    rules:
      - alert: DevOpsSQLPoolWaiting
        expr: sum by (db_name) (rate(go_sql_wait_count_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SQL 连接池等待（{{ $labels.db_name }}）"
          description: "连接池出现等待（{{ $value }}/s），MaxOpenConns 不足或慢查询拖住连接。"

      - alert: DevOpsRedisPoolWaiting
        expr: sum by (pool_name) (rate(db_client_connections_waits[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 连接池等待（{{ $labels.pool_name }}）"
          description: "Redis 连接池出现等待 {{ $value }}/s，PoolSize 不足或慢命令阻塞。"

      - alert: DevOpsRedisPoolTimeouts
        expr: sum by (pool_name) (rate(db_client_connections_timeouts[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 连接池获取超时（{{ $labels.pool_name }}）"
          description: "Redis 取连接超时 {{ $value }}/s，请求正被拒绝：Redis 不可用或池耗尽。"

  - name: devops-runtime
    rules:
      - alert: DevOpsGoroutinesHigh
        expr: go_goroutines{job="devops-services"} > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "goroutine 数量异常（{{ $labels.instance }}）"
          description: "{{ $labels.instance }} 的 goroutine 数 {{ $value }} 持续 10 分钟高于 2000，疑似泄漏或阻塞。"

  # 发号缓冲（idclient SDK 指标，消费方进程导出）与登录业务指标
  - name: devops-idgen-business
    rules:
      - alert: DevOpsIDBufferExhausted
        expr: idgen_buffer_remaining == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "发号缓冲耗尽（biz_tag={{ $labels.biz_tag }}）"
          description: "{{ $labels.service_name }} 的 biz_tag={{ $labels.biz_tag }} 本地缓冲持续 2 分钟为 0：下一次发号将同步 RPC，若补充仍失败，用户创建等写路径开始 fail-fast 返回 500。检查 devops-id 可用性与 {{ $labels.service_name }} → devops-id 网络。"

      - alert: DevOpsIDRefillFailing
        expr: sum by (biz_tag, trigger) (rate(idgen_refill_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "发号缓冲补充失败（{{ $labels.biz_tag }}，{{ $labels.trigger }}）"
          description: "biz_tag={{ $labels.biz_tag }} 补充失败率 {{ $value }}/s 持续 5 分钟。trigger=sync 说明已阻塞业务请求；async 为后台预取失败，是缓冲耗尽的早期信号。检查 devops-id / etcd 状态。"

      - alert: DevOpsLoginFailureRateHigh
        expr: |
          sum by (service_name) (rate(auth_login_total{result="failure"}[10m]))
            /
          sum by (service_name) (rate(auth_login_total[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "登录失败率超 50%（{{ $labels.service_name }}）"
          description: "{{ $labels.service_name }} 登录失败占比 {{ $value | humanizePercentage }} 持续 10 分钟超过 50%：
            可能是暴力破解（401 为主）或认证链路故障（500 为主），按 auth_login_total 的 result/code 标签区分并查访问日志。"

      - alert: DevOpsRegisterFailureRateHigh
        expr: |
          sum by (service_name) (rate(auth_register_total{result="failure", code=~"5.."}[10m]))
            /
          sum by (service_name) (rate(auth_register_total[10m])) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "注册 5xx 失败率超 30%（{{ $labels.service_name }}）"
          description: "{{ $labels.service_name }} 注册因服务端错误失败占比 {{ $value | humanizePercentage }}
            持续 10 分钟超过 30%（仅统计 code=5xx，参数类 4xx 不计）：发号、数据库或口令加密链路故障。"
