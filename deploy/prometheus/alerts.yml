# Prometheus alert rules (mounted at /etc/prometheus/alerts.yml in the dev compose stack).
# Rules are evaluated on the Prometheus side; fired alerts are routed via Alertmanager
# (dev has no external integration, so they are only visible in the Alertmanager UI
# at http://localhost:9093; in prod, swap dev-sink for a DingTalk/WeCom/email webhook).
#
# Thresholds are dev starting values — tune per SLO in prod. Metric names match the dashboard:
#   http_server_requests_total     business HTTP RED (otelgin custom instrumentation)
#   rpc_client_call_duration_seconds   gRPC client (otelgrpc stats handler, devops-system/devops-user → devops-id)
#   go_sql_*                       MySQL connection pool (client_golang DBStatsCollector)
#   db_client_connections_*        Redis connection pool (redisotel)
#   auth_login_total/auth_register_total  auth business metrics (service-layer OTel counter)
# HTTP/auth rules are grouped by service_name; devops-system and devops-user fire independently.
groups:
  - name: devops-availability
    rules:
      - alert: DevOpsScrapeTargetDown
        expr: up{job="devops-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target down {{ $labels.instance }}"
          description: "Prometheus has failed to scrape /metrics on {{ $labels.instance }} for 1 minute; the service may be down or unreachable."

  - name: devops-service-slo
    rules:
      - alert: DevOpsHTTP5xxRateHigh
        expr: |
          sum by (service_name) (rate(http_server_requests_total{service_name=~"devops-(system|user)", status=~"5.."}[5m]))
            /
          sum by (service_name) (rate(http_server_requests_total{service_name=~"devops-(system|user)"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate above 1% ({{ $labels.service_name }})"
          description: "{{ $labels.service_name }} 5xx share has exceeded 1% for 5 minutes (currently {{ $value | humanizePercentage }})."

      - alert: DevOpsHTTPP99High
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_request_duration_seconds_bucket{service_name=~"devops-(system|user)"}[5m])) by (le, route, service_name)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP P99 latency above 1s ({{ $labels.service_name }} {{ $labels.route }})"
          description: "P99 latency for route {{ $labels.route }} on {{ $labels.service_name }} has been above 1s ({{ $value | humanize }}) for 5 minutes."

      - alert: DevOpsGRPCClientErrorRateHigh
        expr: |
          (
            sum(rate(rpc_client_call_duration_seconds_count{rpc_response_status_code!="OK"}[5m])) or vector(0)
          ) / (
            sum(rate(rpc_client_call_duration_seconds_count[5m])) or vector(0)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "gRPC client error rate above 5%"
          description: "Share of non-OK statuses on calls to devops-id has exceeded 5% for 5 minutes; the ID-generation buffer is being slowed by synchronous retries."

  - name: devops-dependencies-use
    rules:
      - alert: DevOpsSQLPoolWaiting
        expr: sum by (db_name) (rate(go_sql_wait_count_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SQL connection pool waiting ({{ $labels.db_name }})"
          description: "Connection pool is waiting ({{ $value }}/s): MaxOpenConns may be too small, or slow queries are holding connections."

      - alert: DevOpsRedisPoolWaiting
        expr: sum by (pool_name) (rate(db_client_connections_waits[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis connection pool waiting ({{ $labels.pool_name }})"
          description: "Redis connection pool is waiting at {{ $value }}/s: PoolSize may be too small, or slow commands are blocking."

      - alert: DevOpsRedisPoolTimeouts
        expr: sum by (pool_name) (rate(db_client_connections_timeouts[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection pool acquisition timeout ({{ $labels.pool_name }})"
          description: "Redis connection acquisition is timing out at {{ $value }}/s and requests are being rejected: Redis is unavailable or the pool is exhausted."

  - name: devops-runtime
    rules:
      - alert: DevOpsGoroutinesHigh
        expr: go_goroutines{job="devops-services"} > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Goroutine count abnormal ({{ $labels.instance }})"
          description: "Goroutine count on {{ $labels.instance }} has been above 2000 ({{ $value }}) for 10 minutes; suspect a leak or blockage."

  # ID-generation buffer (idclient SDK metrics exported by consumer processes) and login business metrics
  - name: devops-idgen-business
    rules:
      - alert: DevOpsIDBufferExhausted
        expr: idgen_buffer_remaining == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ID generation buffer exhausted (biz_tag={{ $labels.biz_tag }})"
          description: "Local buffer for biz_tag={{ $labels.biz_tag }} on {{ $labels.service_name }} has been 0 for 2 minutes: the next ID generation will fall back to a synchronous RPC, and if refilling still fails, write paths such as user creation start failing fast with 500. Check devops-id availability and the {{ $labels.service_name }} → devops-id network."

      - alert: DevOpsIDRefillFailing
        expr: sum by (biz_tag, trigger) (rate(idgen_refill_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ID generation buffer refill failing ({{ $labels.biz_tag }}, {{ $labels.trigger }})"
          description: "Refill failure rate for biz_tag={{ $labels.biz_tag }} has been {{ $value }}/s for 5 minutes. trigger=sync means business requests are already blocking; async is background prefetch failure — an early signal of buffer exhaustion. Check devops-id / etcd health."

      - alert: DevOpsLoginFailureRateHigh
        expr: |
          sum by (service_name) (rate(auth_login_total{result="failure"}[10m]))
            /
          sum by (service_name) (rate(auth_login_total[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Login failure rate above 50% ({{ $labels.service_name }})"
          description: "Login failure share on {{ $labels.service_name }} has exceeded 50% ({{ $value | humanizePercentage }}) for 10 minutes:
            likely brute force (mostly 401) or an auth chain failure (mostly 500); distinguish via the result/code labels on auth_login_total and check access logs."

      - alert: DevOpsRegisterFailureRateHigh
        expr: |
          sum by (service_name) (rate(auth_register_total{result="failure", code=~"5.."}[10m]))
            /
          sum by (service_name) (rate(auth_register_total[10m])) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Registration 5xx failure rate above 30% ({{ $labels.service_name }})"
          description: "Server-error failure share on {{ $labels.service_name }} registrations has been {{ $value | humanizePercentage }}
            for 10 minutes, above 30% (only code=5xx counted; 4xx parameter errors excluded):
            failure in the ID generation, database, or password hashing chain."
