# Alertmanager routing config (mounted at /etc/alertmanager/alertmanager.yml in the dev compose stack).
# dev: dev-sink is a fallback receiver with no external integration — alerts are not forwarded,
# but the Alertmanager UI (http://localhost:9093) shows the full alert list/grouping/silences
# to verify that rules fire.
# prod: replace dev-sink with a DingTalk/WeCom/email webhook (webhook_configs /
# email_configs) and add sub-routes by severity.
global:
  resolve_timeout: 5m

route:
  receiver: dev-sink
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: dev-sink
    # Empty receiver: a valid config with no integrations
