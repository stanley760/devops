# Network policies: enforce unified traffic ingress (the first containment layer in the K8s form)
#
# Prerequisites: the cluster CNI must support NetworkPolicy (Calico / Cilium / Antrea, etc.).
# kind / k3s default to kindnet, which does not support it — apply succeeds without error but has
# **no effect at all**; verify with the method in the "Verification" section below, and do not assume
# containment just because apply succeeded.
#
# Deployment:
#   kubectl apply -f deploy/k8s/devops.yaml
#   kubectl apply -f deploy/k8s/networkpolicy.yaml
#
# Semantics:
#   NetworkPolicy is a "whitelist", not a "blacklist" — once a Pod is selected by any policy,
#   that Pod only accepts the inbound traffic listed in the policies; everything unlisted is denied.
#   Therefore the "who may enter" rules must be given as well; writing only deny rules is ineffective.
#
# Division of labor among the three policies:
#   default-deny-all       fallback: deny all inbound traffic to every Pod in the namespace
#   allow-gateway-to-system   only the gateway can reach devops-system:9999 (the core containment)
#   allow-observe-and-probe   allow Prometheus scraping and kubelet probes, otherwise Pods cannot start
#
# Prerequisite: Higress is installed via the official Helm chart in the higress-system namespace, and its Pods carry the app=higress label.
# If the labels differ, confirm with kubectl -n higress-system get pod --show-labels, then adjust the
# namespaceSelector + podSelector below. Likewise devops-system needs to carry app=devops-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devops
spec:
  # Omitting the selector selects all Pods in this namespace
  podSelector: {}
  policyTypes:
    - Ingress
---
# Core containment: devops-system's business port only accepts traffic from Higress.
# Effect: no Pod (even in the same namespace, even with the database password) can reach
# devops-system:9999 directly and bypass the gateway — any detour simply breaks the connection.
# In the K8s form this layer is truly enforced; the application-layer guard degrades to defense-in-depth.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-system
  namespace: devops
spec:
  podSelector:
    matchLabels:
      app: devops-system
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: higress-system
          podSelector:
            matchLabels:
              app: higress
      ports:
        - protocol: TCP
          port: 9999
---
# Allow kubelet probes and Prometheus scraping.
# kubelet probes originate from the node IP (not in any namespaceSelector); if not allowed,
# livenessProbe will keep failing and Pods will be restarted repeatedly — the most common accident when adding NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observe-and-probe
  namespace: devops
spec:
  podSelector:
    matchLabels:
      app: devops-system
  policyTypes:
    - Ingress
  ingress:
    # Probe: comes from the node; K8s has no usable namespace label, so use ipBlock to open the private CIDRs.
    # Adjust to the actual cluster node CIDRs; the tighter the CIDRs the better — 0.0.0.0/0 is as good as nothing.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 9999
    # Prometheus scrapes /metrics. Same port as the gateway, so it is merged into the rule above;
    # if Prometheus lives in a separate namespace, add its labels to the from list below.
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: monitoring
---
# devops-id only accepts gRPC calls from devops-system.
# It exposes no HTTP interface, so no gateway inbound is allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-system-to-id
  namespace: devops
spec:
  podSelector:
    matchLabels:
      app: devops-id
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: devops-system
      ports:
        - protocol: TCP
          port: 9990
    # Metrics port (9991) for Prometheus scraping; open as needed
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 9991