# Kubernetes deployment manifests (single file, split into sections by separators).
#
# Assumptions (adjust to the actual environment):
#   1. Images are pushed to a registry: registry.example.com/devops/*; replace the image values below with real addresses
#   2. MySQL / Redis / etcd are managed services outside the cluster or deployed independently (connecting to RDS from inside K8s is a common pattern);
#      the addresses in the configs are placeholders — replace them before applying
#   3. The configs contain database passwords and the JWT signing key, hence carried in a Secret rather than a ConfigMap
#      (the current config system has no env-var binding and cannot reference independent Secret keys)
#
# Usage:
#   kubectl apply -f deploy/k8s/devops.yaml
#   kubectl -n devops wait --for=condition=complete job/devops-migrate --timeout=120s
#   kubectl -n devops rollout status deploy/devops-id deploy/devops-system
#
# Design notes:
#   - devops-id replicas 2: each claims an independent worker slot per leaf_name + biz_tag via etcd
#   - devops-system is stateless (sessions in Redis), so it can scale horizontally freely
#   - snowflake depends heavily on the clock: nodes must run NTP/chrony; a backwards step is rejected for ID generation
#   - K8s ≥1.24 can use native grpc probes to check devops-id health
#   - For network isolation see networkpolicy.yaml in the same directory (requires CNI support for NetworkPolicy, e.g. Calico/Cilium)
apiVersion: v1
kind: Namespace
metadata:
  name: devops
---
# devops-id's devops-id-prod.yaml (contains the etcd address, hence a Secret)
apiVersion: v1
kind: Secret
metadata:
  name: devops-id-config
  namespace: devops
stringData:
  devops-id-prod.yaml: |
    log:
      level: info
      console: true
      format: json
    nacos:
      enabled: false
    idgen:
      leaf_name: devops-id
      worker_cache: data
      allow_local_fallback: false
      max_biz_tag_len: 64
      max_generators: 1024
      max_batch_count: 100000
      watermark_safety_margin: 5s
      watermark_persist_interval: 3s
      watermark_max_wait: 30s
    etcd:
      endpoints:
        - "YOUR_ETCD_ENDPOINT:2379"
    # An empty otlp_endpoint means local spans are not reported; fill in the OTLP HTTP address after wiring up an in-cluster Jaeger/Tempo/otel-collector
    observability:
      otlp_endpoint: ""
      sampler_ratio: 0.1
      metrics_enabled: true
      metrics_listen: ":9991"
---
# devops-system's devops-system-prod.yaml (contains MySQL/Redis passwords and the JWT signing key, hence a Secret)
apiVersion: v1
kind: Secret
metadata:
  name: devops-system-config
  namespace: devops
stringData:
  devops-system-prod.yaml: |
    log:
      level: info
      console: true
      format: json
    mysql:
      host: YOUR_MYSQL_HOST
      password: "YOUR_MYSQL_PASSWORD"
    redis:
      host: YOUR_REDIS_HOST
      password: "YOUR_REDIS_PASSWORD"
    nacos:
      enabled: false
    jwt:
      signing_key: "YOUR_JWT_SIGNING_KEY_MIN_32_CHARS"
    idclient:
      endpoint: "devops-id.devops.svc.cluster.local:9990"  # direct Service DNS inside K8s (no scheme, passthrough resolver)
    # An empty otlp_endpoint means local spans are not reported; fill in the OTLP HTTP address after wiring up an in-cluster Jaeger/Tempo/otel-collector
    observability:
      otlp_endpoint: ""
      sampler_ratio: 0.1
      metrics_enabled: true
    apidoc:
      enabled: false          # interactive API docs must be disabled in prod
      base_path: /apidoc
    # Traffic-ingress containment (application-layer guard): require requests to carry a valid Bearer JWT.
    # The gateway side is verified by the Higress jwt-auth plugin (deploy/higress/wasmplugins/jwt-auth-2.0.0.yaml);
    # the application layer verifies once more as defense in depth. Under K8s a NetworkPolicy additionally
    # enforces that only the gateway can reach 9999.
    # The old static X-Gateway-Token (require_token / token) has been removed.
    # The identity source and the gateway exposure whitelist live in the service's own
    # config/bootstrap.yaml (gateway section) — one place per service, environment
    # independent. The gateway is the only JWT verifier there; the NetworkPolicy below is
    # the premise — only the gateway may reach the pod, so the identity headers it injects
    # cannot be forged.
    server:
      trusted_proxies: ["10.0.0.0/8"]   # adjust to the actual ingress/LB CIDRs; use [] for direct connections
---
# Schema migration: business tables + seed data
apiVersion: batch/v1
kind: Job
metadata:
  name: devops-migrate
  namespace: devops
spec:
  backoffLimit: 0          # migration is idempotent and re-runnable, but failures should be investigated manually rather than auto-retried
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: system-migrate
          image: registry.example.com/devops/devops-system:0.1.0
          args: ["migrate"]
          env:
            - name: APP_ENV
              value: prod
          volumeMounts:
            - name: config
              mountPath: /app/config/devops-system-prod.yaml
              subPath: devops-system-prod.yaml
              readOnly: true
      volumes:
        - name: config
          projected:
            sources:
              - secret:
                  name: devops-id-config
              - secret:
                  name: devops-system-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-id
  namespace: devops
  labels:
    app: devops-id
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-id
  template:
    metadata:
      labels:
        app: devops-id
      annotations:
        # Prometheus discovers and scrapes via annotations (or switch to a prometheus-operator ServiceMonitor)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9991"   # OTel metrics on a dedicated HTTP port (the gRPC port cannot serve /metrics)
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: devops-id
          image: registry.example.com/devops/devops-id:0.1.0
          args: ["server"]
          ports:
            - name: grpc
              containerPort: 9990
            - name: metrics
              containerPort: 9991
          env:
            - name: APP_ENV
              value: prod
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          # K8s ≥1.24 native grpc probe, probing grpc.health.v1
          # liveness uses idgen.IdGen.live: a degraded (DEGRADED) state does not kill the Pod, only NotServing triggers a restart
          # readiness uses idgen.IdGen: degraded or unavailable takes the Pod out of service
          livenessProbe:
            grpc:
              port: 9990
              service: idgen.IdGen.live
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 9990
              service: idgen.IdGen
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config/devops-id-prod.yaml
              subPath: devops-id-prod.yaml
              readOnly: true
            # snowflake slot / ID-watermark cache: Pod-level ephemeral volume; re-claimed from etcd after recreation
            - name: worker-cache
              mountPath: /app/data
      volumes:
        - name: config
          secret:
            secretName: devops-id-config
        - name: worker-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devops-id
  namespace: devops
spec:
  selector:
    app: devops-id
  ports:
    - name: grpc
      port: 9990
      targetPort: grpc
    - name: metrics
      port: 9991
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-system
  namespace: devops
  labels:
    app: devops-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-system
  template:
    metadata:
      labels:
        app: devops-system
      annotations:
        # /metrics shares the same HTTP port as business traffic (9999); scraped only inside the cluster, never via the public ingress
        prometheus.io/scrape: "true"
        prometheus.io/port: "9999"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: devops-system
          image: registry.example.com/devops/devops-system:0.1.0
          args: ["server"]
          ports:
            - name: http
              containerPort: 9999
          env:
            - name: APP_ENV
              value: prod
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config/devops-system-prod.yaml
              subPath: devops-system-prod.yaml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: devops-system-config
---
apiVersion: v1
kind: Service
metadata:
  name: devops-system
  namespace: devops
spec:
  selector:
    app: devops-system
  ports:
    - name: http
      port: 9999
      targetPort: http
