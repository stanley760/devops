# Grafana datasource one-shot config: Prometheus (default) + Jaeger (trace ↔ metrics cross-navigation).
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s          # aligned with the Prometheus scrape_interval
  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus   # jump from a span to the corresponding metrics dashboard
